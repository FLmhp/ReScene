<!doctype html>
<html lang="zh-CN" data-site-theme="system" data-type="software" data-radius="soft" data-buttons="solid">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <!-- rescene-theme-init -->
  <title>Knock Community Hall 三维演示 · ReScene</title>
  <meta name="description" content="在浏览器中旋转与缩放公开的 Knock Community Hall 建筑 Gaussian Splat 场景。">
  <link rel="canonical" href="https://rescene.xyz/demo/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Knock Community Hall 三维演示 · ReScene">
  <meta property="og:description" content="在浏览器中旋转与缩放公开的 Knock Community Hall 建筑 Gaussian Splat 场景。">
  <meta property="og:url" content="https://rescene.xyz/demo/">
  <meta property="og:image" content="https://rescene.xyz/social-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Knock Community Hall 三维演示 · ReScene">
  <meta name="twitter:description" content="在浏览器中旋转与缩放公开的 Knock Community Hall 建筑 Gaussian Splat 场景。">
  <meta name="twitter:image" content="https://rescene.xyz/social-card.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/demo.css">
  <script type="module" src="/src/demo.ts"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner container">
      <a class="skip-link" href="#main">跳到正文</a>
      <a class="brand" href="/" aria-label="ReScene 首页">
        <span class="brand-mark"><img src="/media/rescene-mark.svg" alt="" width="34" height="34"></span>
        <span class="brand-word">ReScene</span>
      </a>
      <a class="link-back" href="/">返回官网</a>
      <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="切换主题">
        <svg data-icon="sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg data-icon="moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1" class="demo-main">
    <div class="container">
      <div class="demo-intro">
        <h1>Knock Community Hall</h1>
        <p>在浏览器中旋转和缩放建筑场景。ReScene 将 SOG 裁剪并转换为含 30 万个高斯点的 SPZ 演示产物。</p>
      </div>
      <figure class="demo-stage">
        <div id="demo-viewport" data-model-src="%RESCENE_DEMO_MODEL%">
          <div class="demo-fallback" data-demo-fallback>
            <img src="/media/knock-community-hall-cropped.webp" width="1536" height="1024" alt="裁剪后的 Knock Community Hall SPZ 场景渲染预览">
            <p data-demo-status>启用 JavaScript 与 WebGL2 后可在页面内旋转与缩放；当前仅显示模型预览图。</p>
            <p class="demo-fallback-hint">模型文件约 5 MB，仅在进入本页后按需下载。</p>
          </div>
        </div>
        <figcaption class="demo-credit">
          <span>ReScene SPZ 演示产物</span>
          <span class="demo-credit-links">
            <a class="link" href="/knock-community-hall.LICENSE.txt">素材许可</a>
            <a class="link" href="/">回到官网</a>
          </span>
        </figcaption>
      </figure>
      <p class="demo-note">键盘操作：Tab 进入画面，方向键旋转，<kbd>+</kbd> / <kbd>−</kbd> 缩放，Home 还原。触屏可拖动与双指缩放。</p>
    </div>
  </main>
</body>
</html>
