name: ReScene checks
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rescene
          POSTGRES_PASSWORD: rescene
          POSTGRES_DB: rescene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rescene -d rescene_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RESCENE_TEST_POSTGRES_URL: postgresql+psycopg://rescene:rescene@127.0.0.1:5432/rescene_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c infra/api/constraints.txt -e '.[api,worker,dev]' scipy
      - run: python -m ruff format --check src tests scripts
      - run: python -m ruff check src tests scripts
      - name: Type-check API request schemas
        run: python -m mypy --follow-imports=skip src/rescene_api/schemas.py
      - name: Check golden API contract fixtures
        run: python scripts/generate_contract_fixtures.py --check
      - run: python -m pytest -q

  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject non-conventional commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            range="origin/$BASE_REF..HEAD"
          elif ! git rev-parse --verify --quiet "${BEFORE:-none}^{commit}" >/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then range="HEAD~1..HEAD"; else range="HEAD"; fi
          else
            range="$BEFORE..$SHA"
          fi
          node scripts/check-commits.mjs --range "$range"

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: node scripts/check-api-contracts.mjs
      - run: pnpm check:theme-init
      - run: pnpm test:tokens
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter rescene-web build
      - run: pnpm --filter @rescene/site build
      - run: pnpm --filter @rescene/desktop build
      - run: pnpm --filter @rescene/mobile export
      - run: pnpm --filter @rescene/miniapp build:weapp
        env:
          # The Taro config requires production values; CI proves the build compiles, not that it ships.
          TARO_APP_API_URL: https://api.example.com
          TARO_APP_WEB_URL: https://app.example.com
          TARO_APP_WECHAT_APP_ID: wx0123456789abcdef
      - run: node scripts/check-miniapp-login.mjs
      - run: node scripts/check-mobile-viewer.cjs

  # The runtime dependency tree of the images differs from a workspace install:
  # a devDependency needed while compiling workspace sources only fails here.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rescene
          POSTGRES_PASSWORD: rescene_ci
          POSTGRES_DB: rescene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rescene -d rescene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/api/Dockerfile -t rescene-api:ci .
      - name: Build web image
        run: docker build -f infra/web/Dockerfile -t rescene-web:ci .
      # The image must reach /health/ready against a real PostgreSQL; a bad
      # uvicorn flag or a missing migration only shows here.
      - name: Smoke-test API image
        run: |
          docker run --detach --name rescene-api-smoke --network host \
            --env RESCENE_DATABASE_URL="postgresql+psycopg://rescene:rescene_ci@127.0.0.1:5432/rescene" \
            --env RESCENE_JWT_SECRET="ci-only-jwt-secret-at-least-32-bytes-long" \
            --env RESCENE_WORKER_TOKEN="ci-only-worker-token" \
            rescene-api:ci
          trap 'docker logs rescene-api-smoke >&2 || true; docker rm -f rescene-api-smoke || true' EXIT
          for _ in $(seq 1 60); do
            live=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/live || true)
            ready=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready || true)
            if [ "$live" = "200" ] && [ "$ready" = "200" ]; then
              echo "API image reports live=200 ready=200."
              exit 0
            fi
            sleep 2
          done
          echo "::error::API image did not become live and ready"
          exit 1
      - name: Smoke-test web image
        run: |
          docker run --detach --name rescene-web-smoke --publish 3000:3000 rescene-web:ci
          trap 'docker logs rescene-web-smoke >&2 || true; docker rm -f rescene-web-smoke || true' EXIT
          for _ in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$status" = "200" ]; then
              echo "Web image serves its root page with 200."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Web image did not serve its root page with 200"
          exit 1
