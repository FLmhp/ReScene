name: Release

# Build and hash all installers before deploying. The workflow creates only a
# draft; operators publish it after verifying production and the installers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; must be v plus VERSION"
        required: true
        type: string
      recreate:
        description: "Replace the existing draft only; never replace a published release"
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# Two deploys must never interleave; a replay waits for the running release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  source-manifest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-versions.mjs
      - run: node scripts/release-notes.mjs > /dev/null
      - name: Validate release identity and prerequisites
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RECREATE: ${{ inputs.recreate }}
          DEPLOY: ${{ vars.RELEASE_DEPLOY }}
          SIGN_ANDROID: ${{ vars.RELEASE_ANDROID_SIGNING }}
        run: |
          if [[ "$RELEASE_TAG" != "v$(tr -d '\r\n' < VERSION)" ]]; then
            echo 'Release tag does not match VERSION' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == 'v0.6.0' && ( "$DEPLOY" != 'true' || "$SIGN_ANDROID" != 'true' ) ]]; then
            echo 'v0.6.0 requires production deployment and a signed Android installer' >&2
            exit 1
          fi
          if [[ "$RECREATE" == 'true' ]]; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            [[ "$is_draft" == 'true' ]] || { echo 'Only an existing draft may be recreated' >&2; exit 1; }
          else
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            if grep -Fxq -- "$RELEASE_TAG" <<< "$tags"; then
              echo 'A release already exists for this tag' >&2
              exit 1
            fi
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node scripts/source-manifest.mjs > "$RUNNER_TEMP/source-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-manifest
          path: ${{ runner.temp }}/source-manifest.json
          if-no-files-found: error

  deploy:
    needs: [source-manifest, release-manifest]
    if: |
      !cancelled() &&
      vars.RELEASE_DEPLOY == 'true' &&
      needs.source-manifest.result == 'success' &&
      needs.release-manifest.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      # The tag supplies the source, VERSION and migrations being deployed; the
      # tooling comes from the commit that defines this workflow, so replaying a
      # tag created before the automation still runs the reviewed scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The key only ever exists in the runner temp directory; `ssh-keygen -y`
      # proves the secret survived the shell before the deploy depends on it.
      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          install -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/deploy_key" > /dev/null
      - name: Build on the host, snapshot the database, and swap both services
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_KEY_FILE: ${{ runner.temp }}/ssh/deploy_key
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh/known_hosts
        run: |
          python tooling/scripts/deploy_release.py \
            --root . \
            --tag "$RELEASE_TAG" \
            --version "$(tr -d '\r\n' < VERSION)" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --log deploy-log.json
      # A failed deploy is the run that most needs its log published.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-log
          path: deploy-log.json
          if-no-files-found: warn

  windows-nsis:
    needs: [source-manifest]
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      - name: Check tag against VERSION
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -ne "v$((Get-Content VERSION -Raw).Trim())") {
            throw 'Release tag does not match VERSION'
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - name: Validate release URLs
        shell: pwsh
        env:
          VITE_API_URL: ${{ vars.RELEASE_API_URL }}
          VITE_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          foreach ($name in @('VITE_API_URL', 'VITE_WEB_URL')) {
            $url = $null
            if (-not [Uri]::TryCreate([Environment]::GetEnvironmentVariable($name), [UriKind]::Absolute, [ref]$url) -or $url.Scheme -ne 'https') {
              throw "$name must be an absolute HTTPS URL"
            }
            if ($name -eq 'VITE_API_URL' -and $url.GetLeftPart([UriPartial]::Authority) -ne 'https://api.rescene.xyz') {
              throw 'VITE_API_URL origin must match the desktop CSP: https://api.rescene.xyz'
            }
          }
      - name: Build x64 NSIS installer
        env:
          VITE_API_URL: ${{ vars.RELEASE_API_URL }}
          VITE_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: pnpm --filter @rescene/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Sign installer when a certificate is configured
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Warning 'No Windows signing certificate configured; the installer is unsigned.'
            'artifact=windows-nsis-x64-unsigned' >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required to sign'
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'rescene-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'Windows signtool not found' }
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $installers[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
            & $signtool.FullName verify /pa /all /tw $installers[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'Installer signature verification failed' }
            'artifact=windows-nsis-x64-signed' >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-desktop:
    needs: [source-manifest]
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      - name: Check tag against VERSION
        run: |
          if [[ "$RELEASE_TAG" != "v$(tr -d '\r\n' < VERSION)" ]]; then
            echo 'Release tag does not match VERSION' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKitGTK bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - name: Validate release URLs
        env:
          VITE_API_URL: ${{ vars.RELEASE_API_URL }}
          VITE_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          node -e 'for (const name of ["VITE_API_URL", "VITE_WEB_URL"]) { let url; try { url = new URL(process.env[name]); } catch { throw new Error(`${name} must be an absolute HTTPS URL`); } if (url.protocol !== "https:") throw new Error(`${name} must be an absolute HTTPS URL`); if (name === "VITE_API_URL" && url.origin !== "https://api.rescene.xyz") throw new Error("VITE_API_URL origin must match the desktop CSP: https://api.rescene.xyz"); }'
      - name: Build x64 deb and AppImage
        env:
          VITE_API_URL: ${{ vars.RELEASE_API_URL }}
          VITE_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          pnpm --filter @rescene/desktop tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage
          test -n "$(find apps/desktop/src-tauri/target -path '*/bundle/deb/*.deb' -type f)" || { echo 'No .deb installer was produced' >&2; exit 1; }
          test -n "$(find apps/desktop/src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f)" || { echo 'No .AppImage installer was produced' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            apps/desktop/src-tauri/target/**/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error

  macos-desktop:
    needs: [source-manifest]
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      - name: Check tag against VERSION
        run: |
          if [[ "$RELEASE_TAG" != "v$(tr -d '\r\n' < VERSION)" ]]; then
            echo 'Release tag does not match VERSION' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - name: Validate release URLs
        env:
          VITE_API_URL: ${{ vars.RELEASE_API_URL }}
          VITE_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          node -e 'for (const name of ["VITE_API_URL", "VITE_WEB_URL"]) { let url; try { url = new URL(process.env[name]); } catch { throw new Error(`${name} must be an absolute HTTPS URL`); } if (url.protocol !== "https:") throw new Error(`${name} must be an absolute HTTPS URL`); if (name === "VITE_API_URL" && url.origin !== "https://api.rescene.xyz") throw new Error("VITE_API_URL origin must match the desktop CSP: https://api.rescene.xyz"); }'
      - name: Build unsigned universal dmg (no Apple certificate is configured)
        env:
          VITE_API_URL: ${{ vars.RELEASE_API_URL }}
          VITE_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          pnpm --filter @rescene/desktop tauri build --target universal-apple-darwin --bundles dmg
          test -n "$(find apps/desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f)" || { echo 'No .dmg installer was produced' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    needs: [source-manifest]
    if: vars.RELEASE_ANDROID_SIGNING == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      - name: Check tag against VERSION
        run: |
          if [[ "$RELEASE_TAG" != "v$(tr -d '\r\n' < VERSION)" ]]; then
            echo 'Release tag does not match VERSION' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # android-actions/setup-android@v3 installs the retired `tools` package and
      # now fails with "Failed to find package 'tools'". The runner image already
      # ships the SDK and command-line tools, so use them and fail loudly if the
      # layout ever changes.
      - name: Set up the preinstalled Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "No Android SDK at $sdk_root" >&2; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          tools=$(ls -d "$sdk_root"/cmdline-tools/*/bin | sort -V | tail -1)
          test -x "$tools/sdkmanager" || { echo "No sdkmanager under $sdk_root/cmdline-tools" >&2; exit 1; }
          echo "$tools" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - name: Validate release URLs
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.RELEASE_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          node -e 'for (const name of ["EXPO_PUBLIC_API_URL", "EXPO_PUBLIC_WEB_URL"]) { let url; try { url = new URL(process.env[name]); } catch { throw new Error(`${name} must be an absolute HTTPS URL`); } if (url.protocol !== "https:") throw new Error(`${name} must be an absolute HTTPS URL`); }'
      - name: Require Android signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RESCENE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RESCENE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RESCENE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 RESCENE_ANDROID_KEYSTORE_PASSWORD RESCENE_ANDROID_KEY_ALIAS RESCENE_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "$name is required" >&2; exit 1; fi
          done
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify signed Android APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RESCENE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RESCENE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RESCENE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.RELEASE_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.RELEASE_WEB_URL }}
        run: |
          set -euo pipefail
          export RESCENE_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/rescene-release.keystore"
          trap 'rm -f "$RESCENE_ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RESCENE_ANDROID_KEYSTORE_PATH"
          pnpm exec expo prebuild --platform android --no-install
          (cd android && ./gradlew :app:assembleRelease)
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          test -x "$apksigner"
          verification=$("$apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$verification"
          printf '%s\n' "$verification" | grep -q '^Verifies' || { echo 'apksigner did not report a verified signature' >&2; exit 1; }
          # build-tools 36 labels the signer "V2 Signer:"; older versions print
          # "Signer #1". Match the digest line itself so either layout works.
          actual=$(printf '%s\n' "$verification" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n1 | tr -d ' \r')
          [[ -n "$actual" ]] || { echo 'Could not read the APK signer digest' >&2; exit 1; }
          # `openssl dgst` prints "SHA2-256(stdin)= <hex>"; strip at the `=`.
          expected=$(keytool -exportcert -alias "$RESCENE_ANDROID_KEY_ALIAS" -keystore "$RESCENE_ANDROID_KEYSTORE_PATH" -storepass:env RESCENE_ANDROID_KEYSTORE_PASSWORD | openssl dgst -sha256 | sed 's/^.*=//' | tr -d ' \r')
          [[ "${actual,,}" == "${expected,,}" ]] || { echo "APK signer $actual does not match keystore $expected" >&2; exit 1; }
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging "$apk")
          package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          version_name=$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p")
          [[ "$package_name" == 'app.rescene.mobile' ]] || { echo "Unexpected package: $package_name" >&2; exit 1; }
          [[ "$version_name" == "$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")" ]] || { echo "Unexpected versionName: $version_name" >&2; exit 1; }
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid versionCode: $version_code" >&2; exit 1; }
          native_code=$(printf '%s\n' "$badging" | sed -n 's/^native-code: //p')
          [[ -z "$native_code" || "$native_code" == *arm64-v8a* ]] || { echo "Missing arm64-v8a ABI: $native_code" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signed
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release-manifest:
    needs: [source-manifest, windows-nsis, linux-desktop, macos-desktop, android]
    if: |
      !cancelled() &&
      needs.source-manifest.result == 'success' &&
      needs.windows-nsis.result == 'success' &&
      needs.linux-desktop.result == 'success' &&
      needs.macos-desktop.result == 'success' &&
      (needs.android.result == 'success' || (vars.RELEASE_ANDROID_SIGNING != 'true' && needs.android.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: source-manifest
          path: release-inputs/source
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-nsis-x64-*
          path: release-inputs/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: release-inputs/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: macos-desktop
          path: release-inputs/artifacts
      - uses: actions/download-artifact@v4
        if: vars.RELEASE_ANDROID_SIGNING == 'true'
        with:
          name: android-apk-signed
          path: release-inputs/artifacts
      # upload-artifact keeps whatever directory prefix precedes a `**` glob, so
      # the manifest and `gh release create` must see only files.
      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release-inputs/flat
          find release-inputs/artifacts -type f -exec cp -n {} release-inputs/flat/ \;
          expected=$(find release-inputs/artifacts -type f | wc -l)
          actual=$(find release-inputs/flat -type f | wc -l)
          ls -l release-inputs/flat
          if [ "$expected" -ne "$actual" ]; then
            echo "Artifact names collide: $expected files downloaded, $actual unique" >&2
            exit 1
          fi
      - name: Hash release artifacts
        run: |
          node scripts/release-manifest.mjs --source-manifest release-inputs/source/source-manifest.json release-inputs/flat/* > "$RUNNER_TEMP/release-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error

  github-release:
    needs: [source-manifest, release-manifest, deploy]
    # A failed or unexpectedly skipped deploy must not create a draft.
    if: |
      !cancelled() &&
      needs.release-manifest.result == 'success' &&
      (needs.deploy.result == 'success' || (vars.RELEASE_DEPLOY == 'false' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-manifest.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Flatten release assets
        run: |
          mkdir -p release-flat
          find release-assets -type f -exec cp -n {} release-flat/ \;
          ls -l release-flat
      - name: Compose release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
      - name: Record the release log
        run: |
          node tooling/scripts/release-log.mjs \
            --release-manifest release-flat/release-manifest.json \
            --deploy-log release-flat/deploy-log.json \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --deploy-result "${{ needs.deploy.result }}" \
            > "$RUNNER_TEMP/release-log.json"
      - name: Create the GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RECREATE: ${{ inputs.recreate }}
        run: |
          if [[ "$RECREATE" == 'true' ]]; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            [[ "$is_draft" == 'true' ]] || { echo 'Only an existing draft may be recreated' >&2; exit 1; }
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ReScene $(tr -d '\r\n' < VERSION)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/release-log.json" release-flat/*
